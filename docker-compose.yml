services:
  db:
    image: postgres:16-alpine
    container_name: roger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roger
      POSTGRES_PASSWORD: roger
      POSTGRES_DB: roger
    ports:
      - "5433:5432"
    volumes:
      - roger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roger -d roger"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roger-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://roger:roger@db:5432/roger
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./sample_data:/app/sample_data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roger-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  roger_pgdata:
